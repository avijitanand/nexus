<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — AI Freelancer Marketplace</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#8E0F27" />
</head>
<body>

  <!-- Shared logo gradient + animated background (UI upgrade) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="nx-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.55" stop-color="#ffe6e2"/>
        <stop offset="1" stop-color="#ffb9b3"/>
      </linearGradient>
      <radialGradient id="nx-cherry" cx="35%" cy="30%" r="75%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.55" stop-color="#fff0d2"/>
        <stop offset="1" stop-color="#f0cf94"/>
      </radialGradient>
    </defs>
  </svg>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- ============ SPLASH SCREEN ============ -->
  <div id="splash" class="splash">
    <div class="splash-logo"><svg class="nx-logo" viewBox="0 0 64 64" role="img" aria-label="Nexus logo">
        <rect class="nx-tile" x="4" y="4" width="56" height="56" rx="18"/>
        <circle class="nx-orbit" cx="32" cy="32" r="26" pathLength="100"/>
        <path class="nx-n" d="M19 45 V19 L41 45 V19" pathLength="1"/>
        <circle class="nx-dot" cx="49" cy="45" r="3.6"/>
      </svg></div>
    <div class="splash-sub">AI-Powered Marketplace</div>
  </div>

  <!-- ============ AUTH VIEW ============ -->
  <div id="view-auth" class="view hidden">
    <div class="auth-container">
      <div class="auth-brand">
        <div class="brand-logo"><svg class="nx-logo" viewBox="0 0 64 64" role="img" aria-label="Nexus logo">
        <rect class="nx-tile" x="4" y="4" width="56" height="56" rx="18"/>
        <circle class="nx-orbit" cx="32" cy="32" r="26" pathLength="100"/>
        <path class="nx-n" d="M19 45 V19 L41 45 V19" pathLength="1"/>
        <circle class="nx-dot" cx="49" cy="45" r="3.6"/>
      </svg></div>
        <h1>Nexus</h1>
        <p>Where AI negotiates the best deals for you.</p>
      </div>

      <div class="auth-tabs">
        <div class="tab active" data-tab="login">Sign In</div>
        <div class="tab" data-tab="signup">Sign Up</div>
      </div>

      <!-- LOGIN FORM (with Google button) -->
      <form id="login-form" class="auth-form">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In →</button>

        <div class="auth-divider">or</div>
        <button type="button" id="google-btn" class="btn btn-ghost btn-block">
          <span style="font-size:16px; font-weight:700; color:#4285F4;">G</span> Continue with Google
        </button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="auth-form hidden">
        <div class="field">
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="John Doe" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required placeholder="••••••••" />
        </div>
        <div class="field">
          <label>I am a…</label>
          <div class="role-select">
            <label class="role-option">
              <input type="radio" name="role" value="client" checked />
              <span>🏢 Client</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="freelancer" />
              <span>💼 Freelancer</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account →</button>
      </form>
    </div>
  </div>

  <!-- ============ MAIN APP VIEW ============ -->
  <div id="view-main" class="view hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo"><svg class="nx-logo" viewBox="0 0 64 64" role="img" aria-label="Nexus logo">
        <rect class="nx-tile" x="4" y="4" width="56" height="56" rx="18"/>
        <circle class="nx-orbit" cx="32" cy="32" r="26" pathLength="100"/>
        <path class="nx-n" d="M19 45 V19 L41 45 V19" pathLength="1"/>
        <circle class="nx-dot" cx="49" cy="45" r="3.6"/>
      </svg></div>
        <span class="brand-name">Nexus</span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar" id="side-avatar">U</div>
          <div class="user-info">
            <div class="user-name" id="side-name">User</div>
            <div class="user-role" id="side-role">client</div>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-icon" title="Logout">⏻</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn btn-ghost btn-icon">☰</button>
        <h2 id="view-title" class="view-title">Dashboard</h2>
        <div class="topbar-actions">
          <button id="notif-btn" class="btn btn-ghost btn-icon">
            🔔<span id="notif-badge" class="badge hidden">0</span>
          </button>
          <div class="avatar" id="user-avatar">U</div>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <!-- Modal & Toast Roots -->
  <div id="modal-root"></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- ============ FIREBASE SDK ============ -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCkg84ZMKeVHqBsg-WjdDoqsGwUoXa4S6I",
      authDomain: "nexus-b272e.firebaseapp.com",
      projectId: "nexus-b272e",
      storageBucket: "nexus-b272e.firebasestorage.app",
      messagingSenderId: "489218650519",
      appId: "1:489218650519:web:6c5fb7972a5a9eefc214d2"
    };

    firebase.initializeApp(firebaseConfig);

    window.firebaseAuth = firebase.auth();
    window.firebaseDb = firebase.firestore();
    window.firebaseFuncs = {
      GoogleAuthProvider: firebase.auth.GoogleAuthProvider,
      createUserWithEmailAndPassword: (a, e, p) => a.createUserWithEmailAndPassword(e, p),
      signInWithEmailAndPassword: (a, e, p) => a.signInWithEmailAndPassword(e, p),
      signInWithPopup: (a, prov) => a.signInWithPopup(prov),
      signOut: a => a.signOut(),
      doc: (d, ...paths) => d.doc(paths.join('/')),
      setDoc: (ref, data, opts) => ref.set(data, opts),
      getDoc: ref => ref.get(),
      updateDoc: (ref, data) => ref.update(data),
    };
  </script>

  <!-- ============ APP SCRIPTS ============ -->
  <script src="ai.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
</body>
</html>
